[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-retrieval-negative-miner"
version = "0.1.0"
description = "Mines hard negative distractor passages from past agent hallucination traces to fine-tune retrieval precision"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-retrieval-negative-miner = "agent_retrieval_negative_miner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_retrieval_negative_miner*"]
